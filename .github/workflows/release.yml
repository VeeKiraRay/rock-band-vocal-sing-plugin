# .github/workflows/release.yml
name: Build Release VST3

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:   # Windows; also writes the release notes
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same approach as the helper-scripts repo: changelog from the commits between
      # the previous tag and this one, with noise (docs/refactor/chore) filtered out.
      - name: Generate filtered release notes
        id: notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE=""            # first release — include the whole history
          else
            RANGE="$PREV_TAG..HEAD"
          fi
          NOTES=$(git log $RANGE --pretty=format:"- %s" \
            | grep -v -i "^- documentation:" \
            | grep -v -i "^- doc:" \
            | grep -v -i "^- refactor:" \
            | grep -v -i "^- chore:" || true)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 (Release)
        run: cmake --build build --config Release --parallel

      # The VST3 is a bundle (folder). PRODUCT_NAME drives its name, so locate it by
      # extension instead of hard-coding, then zip the whole bundle at the zip root.
      - name: Package VST3 bundle
        id: package
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter '*.vst3' |
                  Select-Object -First 1
          if (-not $vst3) { throw 'No .vst3 bundle was produced by the build.' }
          Write-Host "Found VST3 bundle: $($vst3.FullName)"
          $zip = "RB-Vocal-Sing-$env:TAG-VST3-Windows.zip"
          Compress-Archive -Path $vst3.FullName -DestinationPath $zip -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload VST3 to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
          body: ${{ steps.notes.outputs.notes }}

  # Runs in parallel with the Windows job. It only attaches its zip: the release notes
  # belong to the Windows job, and `gh release upload` cannot touch them. Every asset is
  # uploaded as our own zip, so a release download is a single zip (unlike workflow
  # artifacts, which GitHub wraps in a second one unless `archive: false`).
  build-macos:
    runs-on: macos-latest   # always a supported image; the target OS is set in CMakeLists.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install ninja

      # Universal binary (Apple Silicon + Intel). The minimum macOS version is pinned in
      # CMakeLists.txt, because JUCE's juceaide helper needs it too. Tests are skipped
      # here; they run on every push in tests.yml.
      - name: Configure CMake (Release, universal)
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRBVS_BUILD_TESTS=OFF
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build VST3 (Release)
        run: cmake --build build --target RBVocalSing_VST3

      # ditto keeps the file permissions and the ad-hoc code signature, which a plain
      # zip of the bundle can lose.
      - name: Package VST3 bundle
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VST3=$(find build -type d -name '*.vst3' -path '*Release*' | head -1)
          [ -n "$VST3" ] || { echo "No .vst3 bundle was produced by the build."; exit 1; }
          echo "Found VST3 bundle: $VST3"
          lipo -info "$VST3/Contents/MacOS/"*
          ZIP="RB-Vocal-Sing-$TAG-VST3-macOS.zip"
          ditto -c -k --keepParent "$VST3" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload VST3 to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "${{ steps.package.outputs.zip }}" --clobber

  # Same pattern as build-macos: parallel, attaches its zip only.
  build-linux:
    runs-on: ubuntu-22.04   # older glibc than 24.04, so the binary runs on more distros

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The runner image lists GitHub's Azure-hosted Ubuntu mirror first; when that name
      # stops resolving the whole install fails, so use Ubuntu's own servers (they carry
      # the -updates and -security pockets too). cmake and pkg-config (as pkgconf) are
      # preinstalled; asking apt for pkg-config would swap out pkgconf for no gain.
      - name: Install tools and JUCE libraries
        timeout-minutes: 10       # normally ~1 min; fail fast if the Ubuntu servers hang
        run: |
          printf 'http://archive.ubuntu.com/ubuntu/\nhttp://security.ubuntu.com/ubuntu/\n' \
            | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential ninja-build \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev
          ldd --version | head -1

      # Tests are skipped here; they run on every push in tests.yml, and on Linux in the
      # manual dry run.
      - name: Configure CMake (Release)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRBVS_BUILD_TESTS=OFF

      - name: Build VST3 (Release)
        run: cmake --build build --target RBVocalSing_VST3

      # zip -y keeps the bundle's permissions and any symlinks.
      - name: Package VST3 bundle
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VST3=$(find build -type d -name '*.vst3' -path '*Release*' | head -1)
          [ -n "$VST3" ] || { echo "No .vst3 bundle was produced by the build."; exit 1; }
          echo "Found VST3 bundle: $VST3"
          ZIP="RB-Vocal-Sing-$TAG-VST3-Linux.zip"
          (cd "$(dirname "$VST3")" && zip -ry "$GITHUB_WORKSPACE/$ZIP" "$(basename "$VST3")")
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload VST3 to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "${{ steps.package.outputs.zip }}" --clobber
